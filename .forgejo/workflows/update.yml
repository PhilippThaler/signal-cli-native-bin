name: Update PKGBUILD

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new upstream release
        id: check
        run: |
          latest=$(curl -sS https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r .tag_name)
          latest_ver="${latest#v}"
          current_ver=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "latest=$latest_ver" >> $GITHUB_OUTPUT
          echo "current=$current_ver" >> $GITHUB_OUTPUT
          if [ "$latest_ver" != "$current_ver" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
            echo "New version available: $latest_ver (current: $current_ver)"
          else
            echo "update=false" >> $GITHUB_OUTPUT
            echo "Already up to date ($current_ver)"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.update == 'true'
        run: bash update.sh

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.update == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pacman-package-manager makepkg
          sudo useradd -m builder
          sudo chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && HOME=/home/builder makepkg --printsrcinfo" > .SRCINFO

      - name: Commit and push to Forgejo
        if: steps.check.outputs.update == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "Philipp Thaler"
          git config user.email "aur@thaler.fyi"
          git add PKGBUILD .SRCINFO
          git commit -m "Bump to ${{ steps.check.outputs.latest }}"
          git push origin main

      - name: Push to AUR
        run: |
          set -euo pipefail
          key=$(mktemp)
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          push_dir=$(mktemp -d)
          git clone --quiet ssh://aur@aur.archlinux.org/signal-cli-native-bin.git "$push_dir"
          cd "$push_dir"
          cp "$GITHUB_WORKSPACE"/PKGBUILD "$GITHUB_WORKSPACE"/.SRCINFO "$GITHUB_WORKSPACE"/.nvchecker.toml .
          git config user.name "Philipp Thaler"
          git config user.email "aur@thaler.fyi"
          git add PKGBUILD .SRCINFO .nvchecker.toml
          if git diff --cached --quiet; then
            echo "AUR already up to date - nothing to push"
            exit 0
          fi
          git commit -m "Bump to $(grep '^pkgver=' PKGBUILD | cut -d= -f2)"
          git push origin HEAD:master
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
