name: Update PKGBUILD

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new upstream release
        id: check
        run: |
          latest=$(curl -sS https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r .tag_name)
          latest_ver="${latest#v}"
          current_ver=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "latest=$latest_ver" >> $GITHUB_OUTPUT
          echo "current=$current_ver" >> $GITHUB_OUTPUT
          if [ "$latest_ver" != "$current_ver" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
            echo "New version available: $latest_ver (current: $current_ver)"
          else
            echo "update=false" >> $GITHUB_OUTPUT
            echo "Already up to date ($current_ver)"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.update == 'true'
        run: bash update.sh

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.update == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pacman-package-manager makepkg
          makepkg --printsrcinfo > .SRCINFO

      - name: Commit and push to Forgejo
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "Philipp Thaler"
          git config user.email "aur@thaler.fyi"
          git add PKGBUILD .SRCINFO
          git commit -m "Bump to ${{ steps.check.outputs.latest }}"
          git push origin main

      - name: Push to AUR
        if: steps.check.outputs.update == 'true'
        run: |
          echo "$AUR_SSH_KEY" > /tmp/aur-key
          chmod 600 /tmp/aur-key
          mkdir -p /tmp/aur-push
          cp PKGBUILD .SRCINFO .nvchecker.toml /tmp/aur-push/
          cd /tmp/aur-push
          git init
          git config user.name "Philipp Thaler"
          git config user.email "aur@thaler.fyi"
          git add PKGBUILD .SRCINFO .nvchecker.toml
          git commit -m "Bump to ${{ steps.check.outputs.latest }}"
          GIT_SSH_COMMAND="ssh -i /tmp/aur-key -o StrictHostKeyChecking=accept-new" git push -f ssh://aur@aur.archlinux.org/signal-cli-native-bin.git HEAD:master
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
